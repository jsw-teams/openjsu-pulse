siteUrl: https://status.openjsu.com
defaultLocale: zh-tw
activeLocales:
  - zh-tw
siteName:
  zh-tw: OpenJSU Pulse
description:
  zh-tw: OpenJSU 公開服務的即時探針狀態與可用性總覽。
author:
  zh-tw: OpenJSU Operations
theme:
  name: default
  nav:
    links:
      - key: home
        href: /:locale/
      - key: actions
        href: https://github.com/jsw-teams/openjsu-pulse/actions/workflows/probes.yml
    utilityLinks: []

# Site configuration selects built-in capabilities; markup, CSS, and browser code stay in the theme.
plugins:
  search:
    enabled: false
    provider: Pagekiln
  privacyConsent:
    enabled: false
    provider: Pagekiln

icons:
  favicon: /favicon.ico
  icon32: /favicon-32x32.png
  appleTouchIcon: /apple-touch-icon.png
  icon192: /assets/icon-192.png
  icon512: /assets/icon-512.png
  source: /assets/icon-source.png
  manifest: /site.webmanifest

branding:
  showAttribution: false
  attributionUrl: https://github.com/jsw-teams/openjsu-pulse
  attribution:
    zh-sg: Pagekiln by JSW Teams
    zh-tw: Pagekiln by JSW Teams
    en: Pagekiln by JSW Teams

pwa:
  backgroundColor: "#f4f7fb"
  themeColor: "#14263d"

images:
  social: assets/og-default-product.webp
  variants:
    - source: og-default-product-source.png
      output: assets/og-default-product.webp
      width: 1200
      height: 630
      fit: cover
      format: webp
      quality: 82

robots:
  rules:
    - userAgent: "*"
      allow:
        - /

llms:
  title: OpenJSU Pulse
  description: OpenJSU public service probe status and availability dashboard.
  full:
    enabled: true
    shardSize: 250

search:
  enabled: false
  maxResults: 8
  shardSize: 500

outputs:
  markdownMirrors: true

archive:
  enabled: false

feed:
  enabled: false

privacy:
  controller:
    name: OpenJSU Operations
    contactUrl: https://github.com/jsw-teams/openjsu-pulse
    supervisoryAuthorityUrl: https://edpb.europa.eu/about-edpb/about-edpb_en
  cookieConsent:
    enabled: false
    policyRoute: /:locale/privacy/
    agentRoute: /.well-known/agent.json
    storage: cookie
    retentionDays: 365
    categories:
      - id: essential
        required: true
        default: true
        retentionDays: 365
      - id: analytics
        required: false
        default: false
        retentionDays: 0
      - id: advertising
        required: false
        default: false
        retentionDays: 0
content:
  collections:
      pages:
        contentType: page
        pattern: document
        route: /:locale/:id/
        schema:
        title:
          type: string
          required: true
          description: string
          pattern: string
      posts:
        contentType: post
        pattern: blog
        route: /:locale/posts/:id/
        feed: true
        archive: true
        orderBy: date:desc
        schema:
          title:
            type: string
            required: true
          description: string
          date:
            type: string
            required: true
          cover: string
          ogImage: string
          pattern: string
deployment:
  targets: []
  cloudflare:
    accountId: null
    apiTokenEnv: CLOUDFLARE_API_TOKEN
    pages:
      project: null
      branch: null
    workers:
      name: null
      compatibilityDate: '2026-08-10'
  github:
    remote: null
    branch: null
    tokenEnv: GITHUB_TOKEN
  vps:
    host: null
    user: null
    port: 22
    remotePath: null
    identityFile: null
    publicKeyFile: null
  backend: true
  dynamicRoutes:
    - /api/health
