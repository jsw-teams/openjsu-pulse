siteUrl: https://example.com
defaultLocale: en
activeLocales:
  - en
siteName:
  en: Pagekiln Starter
description:
  en: A neutral Pagekiln starter site.
author:
  en: Site Owner
theme:
  name: default
  nav:
    links:
      - key: home
        href: /:locale/
      - key: about
        href: /:locale/about/
    utilityLinks: []

icons:
  favicon: /favicon.ico
  icon32: /favicon-32x32.png
  appleTouchIcon: /apple-touch-icon.png
  icon192: /assets/icon-192.png
  icon512: /assets/icon-512.png
  manifest: /site.webmanifest

pwa:
  backgroundColor: "#f7f2e8"
  themeColor: "#17211d"

head:
  meta:
    - name: theme-color
      content: "#17211d"
      enabled: true
  links: []

robots:
  rules:
    - userAgent: "*"
      allow:
        - /

llms:
  title: Pagekiln Starter
  description: A neutral starter site for Pagekiln.

feed:
  title: Pagekiln Starter
